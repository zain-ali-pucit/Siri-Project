schema_version = "1.3"

[task]
name = "siri-ios/simulator-check-11223344"
description = "Simulator Check"
authors = [{ name = "AfterQuery" }]

[metadata]
difficulty = "medium"
category = "simulator_verify"
tags = ["swift"]

[metadata.mobile]
platform = "ios"
device_profile = "ios26.3-iphone17pro"

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 1200

[environment]
os = "linux"
workdir = "/workspace"

[pre_agent]
commands = ["bash /workspace/scripts/boot_simulator.sh"]
timeout_sec = 180
